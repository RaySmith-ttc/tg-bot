[versions]
kotlin = "2.2.0"
tgBot = "1.0.0-beta.18"

logback = "1.5.18"
assertj = "3.27.3"
benManes-versions = "0.52.0"
dokka = "2.0.0"
exposed = "0.61.0"
h2 = "2.2.220"
hikari = "5.0.1"
htmldiff = "1.0.0"
jsoup = "1.18.1"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.8.1"
konsist = "0.17.3"
seskar = "4.12.0"
setupapp = "1.10"
utils = "3.4.0"

[libraries]

# kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# js
seskar-core = { module = "io.github.turansky.seskar:seskar-core", version.ref = "seskar" }

# database
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# raysmith
raysmith-tgBot = { module = "ru.raysmith:tg-bot", version.ref = "tgBot" }

# logging
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
benManes-versions = { id = "com.github.ben-manes.versions", version.ref = "benManes-versions" }

[bundles]
database = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-dao",
    "exposed-java-time",
    "hikari",
    "h2"
]
